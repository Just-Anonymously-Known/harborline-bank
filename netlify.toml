# Harborline frontend (static site). The API runs on Render; /api calls are forwarded there,
# so the browser only ever talks to this site (no CORS or third-party-cookie problems).
[build]
publish = "public"

# CHANGE the address below if your Render URL is different.
[[redirects]]
from = "/api/*"
to = "https://harborline-bank.onrender.com/api/:splat"
status = 200
force = true

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
